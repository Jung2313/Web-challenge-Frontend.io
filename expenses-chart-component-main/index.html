<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">

  <title>Frontend Mentor | Expenses chart component</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,700;1,9..40,700&display=swap"
    rel="stylesheet">

</head>

<body>

  <main class="container">
    <header class="header">
      <section class="mybalance">
        <span class="title">My balance</span>
        <p class="price">$921.48</p>
      </section>
      <img src="images/logo.svg" alt="Logo" class="logo">
    </header>

    <section class="content">
      <h1>Spending - Last 7 days</h1>

      <div class="balance-graphic-wrap">


      </div>

      <hr>


      <div class="total">
        <section class="total-month">
          <p class="total-small">Total this month</p>
          <p class="total-price"> $478.33</p>
        </section>
        <section>
          <p class="incre">+2.4%</p>
          <p class="percent">from last month</p>
        </section>


      </div>

    </section>
  </main>

  <script src="chart.js"></script>
</body>

</html>
